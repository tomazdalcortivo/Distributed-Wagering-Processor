services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle-wagering-postgres
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_secret
      POSTGRES_DB: jungle_wagering
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.7
    container_name: jungle-wagering-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: 1
    volumes:
      - "./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues"]
      interval: 5s
      timeout: 5s
      retries: 15

  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jungle-wagering-app-1
    profiles: ["cluster"]
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jungle_wagering
      DB_USER: jungle
      DB_PASSWORD: jungle_secret
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_OUTBOX_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wagering-integration-events.fifo
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jungle-wagering-app-2
    profiles: ["cluster"]
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-2
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jungle_wagering
      DB_USER: jungle
      DB_PASSWORD: jungle_secret
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_OUTBOX_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wagering-integration-events.fifo
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jungle-wagering-app-3
    profiles: ["cluster"]
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-3
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jungle_wagering
      DB_USER: jungle
      DB_PASSWORD: jungle_secret
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_OUTBOX_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wagering-integration-events.fifo
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  pgdata:
